<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WElcome Text Formatting</title>
</head>
<body>
<!___Heading tags___>
<h1>WELCOME</h1>
<h2>WELCOME</h2>
<h3>WELCOME</h3>
<h4>WELCOME</h4>
<h5>WELCOME</h5>
<h6>WELCOME</h6>
<!___Bold text___>
<p><b>Welcome</b></p>
<!___Italic text___>
<p><i>Welcome</i></p>
<!___Underline text___>
<p><u>Welcome</u></p>
<!___Strikethrough text___>
<p><s>Welcome</s></p>
<!___Div tag with multiple formats___>
<div>
<p><b><i>Welcome</i> to <u>everyone</u>.We respect everyone.</b></p>
</div>
<!___Preformatted text___>
<pre>
Welcome to our website!
Welcome everyone.
Welcome once again
</pre>
</body>
</html>
