<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Lab</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--accent:#3a3a3a;--accent-dark:#000;--border:#e5e5e5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:32px 20px 26px;text-align:center;background:var(--card);border-bottom:1px solid var(--border)}
header h1{font-size:1.8rem;font-weight:700;letter-spacing:-.02em;color:var(--text)}
main{max-width:820px;margin:0 auto;padding:28px 16px 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 14px;text-align:center;cursor:pointer;font-weight:600;font-size:.95rem;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.15s}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
#subView,#fileView{display:none;margin-top:20px}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:16px;color:var(--accent);cursor:pointer;font-size:.9rem;font-weight:600}
.back:hover{text-decoration:underline}
#subView h2,#fileView h2{margin-bottom:14px;font-size:1.25rem;font-weight:700}
.file-list{list-style:none;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.file-list li{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border)}
.file-list li:last-child{border-bottom:none}
.file-list li:hover{background:#f8f8fc}
.file-list a{color:#fff;background:var(--accent);text-decoration:none;font-size:.82rem;font-weight:600;padding:6px 14px;border-radius:7px;transition:.15s}
.file-list a:hover{background:var(--accent-dark)}
.file-list .actions{display:flex;gap:8px}
.toolbar{display:none;align-items:center;gap:12px;margin-bottom:12px}
.toolbar button{border:none;background:var(--accent);color:#fff;font-weight:600;font-size:.85rem;padding:9px 18px;border-radius:8px;cursor:pointer;transition:.15s}
.toolbar button:hover{background:var(--accent-dark)}
.toolbar button:disabled{opacity:.6;cursor:default}
#dlStatus{font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);padding:18px;font-size:.9rem;text-align:center;justify-content:center!important}
</style>
</head>
<body>

<header><h1>All Lab</h1></header>

<main>
  <!-- Main sections -->
  <div id="sectionView">
    <div class="grid" id="grid"></div>
  </div>

  <!-- EX 1 - EX 10 (for WD File and C File) -->
  <div id="subView">
    <span class="back" onclick="goBack()">&larr; Back to sections</span>
    <h2 id="subViewTitle"></h2>
    <div class="grid" id="subGrid"></div>
  </div>

  <!-- File list -->
  <div id="fileView">
    <span class="back" id="fileBack" onclick="goBack()">&larr; Back</span>
    <h2 id="fileViewTitle"></h2>
    <div class="toolbar" id="toolbar"><button id="dlAll" onclick="downloadAll()">Download All</button><span id="dlStatus"></span></div>
    <ul class="file-list" id="fileList"></ul>
  </div>
</main>

<script>
/* =======================================================
   FILE BROWSER
   Files live in the SAME folder as this index.html (flat).
   Add or remove filenames below to match what's actually there.
   "WD File" and "C File" have sub-sections EX 1 - EX 10;
   put each experiment's filenames in its "files" list.
   ======================================================= */

function makeExercises() {
  const ex = {};
  for (let i = 1; i <= 10; i++) ex["EX " + i] = { folder: "", files: [] };
  return ex;
}

function wdFileExercises() {
  const ex = makeExercises();
  ex["EX 1"].files = ["ex1.html"];
  ex["EX 2"].files = ["python.html","javascript.html","ex2.html","html.html","java.html","css.html","cplus.html"];
  ex["EX 3"].files = ["components.html","ex3.html","computer.png"];
  return ex;
}

const sections = {
  "RDBMS":            { folder: "",  files: ["rdbms1.docx","rdbms2.docx","rdbms3.docx","rdbms4.doc","rdbms5.doc","rdbms6.docx","rdbms7.docx","rdbms8.docx","rdbms9.docx","rdbms10.docx"] },
  "Web Designing":    { folder: "",  files: ["wd1.doc","wd2.doc","wd3.doc","wd4.doc","wd5.doc","wd6.doc","wd7.doc","wd8.doc","wd9.doc","wd10.doc"] },
  "Operating System": { folder: "",  files: ["os1.docx","os2.docx","os3.docx","os4.docx","os5.docx","os6.docx","os7.docx","os8.docx"] },
  "C Programming":    { folder: "",  files: ["cp1.docx","cp2.docx","cp3.docx","cp4.docx","cp5.docx","cp6.doc","cp7.doc","cp8.doc","cp9.doc","cp10.doc"] },
  "DLD Lab":          { folder: "",  files: ["dld1.docx","dld2.docx"] },
  "WD File":          { subsections: wdFileExercises() },
  "C File":           { subsections: makeExercises() }
};

const grid = document.getElementById('grid');
const subGrid = document.getElementById('subGrid');
const sectionView = document.getElementById('sectionView');
const subView = document.getElementById('subView');
const subViewTitle = document.getElementById('subViewTitle');
const fileView = document.getElementById('fileView');
const fileList = document.getElementById('fileList');
const fileViewTitle = document.getElementById('fileViewTitle');
const fileBack = document.getElementById('fileBack');

let currentSection = null;
let currentLinks = [];

Object.keys(sections).forEach(name => {
  const div = document.createElement('div');
  div.className = 'card';
  div.textContent = name;
  div.onclick = () => openSection(name);
  grid.appendChild(div);
});

function show(view) {
  sectionView.style.display = view === 'sections' ? 'block' : 'none';
  subView.style.display = view === 'subs' ? 'block' : 'none';
  fileView.style.display = view === 'files' ? 'block' : 'none';
}

function openSection(name) {
  currentSection = name;
  const data = sections[name];
  if (data.subsections) {
    subViewTitle.textContent = name;
    subGrid.innerHTML = '';
    Object.keys(data.subsections).forEach(sub => {
      const div = document.createElement('div');
      div.className = 'card';
      div.textContent = sub;
      div.onclick = () => openFiles(name + ' \u2013 ' + sub, data.subsections[sub], true);
      subGrid.appendChild(div);
    });
    show('subs');
  } else {
    openFiles(name, data, false);
  }
}

function openFiles(title, data, fromSub) {
  fileViewTitle.textContent = title;
  fileBack.innerHTML = fromSub ? '&larr; Back to ' + currentSection : '&larr; Back to sections';
  fileList.innerHTML = '';
  currentLinks = data.files.map(f => data.folder ? `${data.folder}/${f}` : f);
  document.getElementById('toolbar').style.display = data.files.length > 1 ? 'flex' : 'none';
  document.getElementById('dlStatus').textContent = '';
  document.getElementById('dlAll').disabled = false;
  if (!data.files.length) {
    fileList.innerHTML = '<li class="empty">No files added yet.</li>';
  } else {
    data.files.forEach(f => {
      const li = document.createElement('li');
      const href = data.folder ? `${data.folder}/${f}` : f;
      const isWord = /\.docx?$/i.test(f);
      let openHref = href;
      // Word files can't open directly in a browser, so use Microsoft's online viewer
      if (isWord && location.protocol.startsWith('http')) {
        openHref = 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(new URL(href, location.href).href);
      }
      li.innerHTML = `<span>${f}</span><span class="actions">` +
        `<a href="${openHref}" target="_blank" rel="noopener">Open</a>` +
        `<a href="${href}" download>Download</a></span>`;
      fileList.appendChild(li);
    });
  }
  show('files');
}

// Downloads every file in the open list, one after another (no zip)
function downloadAll() {
  const btn = document.getElementById('dlAll');
  const status = document.getElementById('dlStatus');
  const links = currentLinks.slice();
  btn.disabled = true;
  let i = 0;
  (function next() {
    if (i >= links.length) {
      status.textContent = 'Done \u2013 ' + links.length + ' files downloaded.';
      btn.disabled = false;
      return;
    }
    status.textContent = 'Downloading ' + (i + 1) + ' of ' + links.length + '\u2026';
    const a = document.createElement('a');
    a.href = links[i];
    a.download = links[i].split('/').pop();
    document.body.appendChild(a);
    a.click();
    a.remove();
    i++;
    setTimeout(next, 700);
  })();
}

function goBack() {
  if (fileView.style.display === 'block' && sections[currentSection].subsections) {
    show('subs');
  } else {
    show('sections');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sectionView.style.display !== 'block') goBack();
});
</script>

</body>
</html>
